<!-- delta/templates/report_html.html -->

<!DOCTYPE html>

<html lang="en">



<head>

    <meta charset="UTF-8">

    <title>{{ title }} - {{ target }}</title>

    <style>

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

        }



        body {

            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

            background: #f5f5f5;

            color: #333;

        }



        .container {

            max-width: 1000px;

            margin: 0 auto;

            padding: 20px;

        }



        .header {

            background: linear-gradient(135deg, #667eea, #764ba2);

            color: white;

            padding: 40px;

            border-radius: 12px;

            margin-bottom: 30px;

        }



        .risk-badge {

            display: inline-block;

            padding: 8px 20px;

            border-radius: 20px;

            font-weight: bold;

            font-size: 1.2em;

        }



        .section {

            background: white;

            border-radius: 8px;

            padding: 25px;

            margin-bottom: 20px;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);

        }



        table {

            width: 100%;

            border-collapse: collapse;

        }



        th,

        td {

            padding: 12px;

            text-align: left;

            border-bottom: 1px solid #eee;

        }



        th {

            background: #f8f9fa;

            font-weight: 600;

        }



        .finding {

            border-left: 4px solid #667eea;

            padding: 15px;

            margin: 10px 0;

            background: #f8f9fa;

            border-radius: 4px;

        }



        .footer {

            text-align: center;

            padding: 20px;

            color: #999;

        }

    </style>

</head>



<body>

    <div class="container">

        <div class="header">

            <h1>{{ title }}</h1>

            <p>Target: <strong>{{ target }}</strong></p>

            <p>Date: {{ scan_date }}</p>

            <p class="risk-badge">Risk: {{ risk_level }}</p>

        </div>

        <div class="section">

            <h2>Executive Summary</h2>

            <p>{{ summary }}</p>

        </div>

        {% if findings %}

        <div class="section">

            <h2>Findings</h2>

            {% for f in findings %}

            <div class="finding">

                <h3>{{ f.title }}</h3>

                <p>{{ f.description }}</p>

            </div>

            {% endfor %}

        </div>

        {% endif %}

        <div class="footer">Generated by Delta Security Assessment CLI</div>

    </div>

</body>



</html>
