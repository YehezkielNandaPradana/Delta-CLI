name: Build Delta Agent Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: delta/mobile/package-lock.json

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Mobile Dependencies
        working-directory: delta/mobile
        run: npm ci || npm install

      - name: Prebuild Native Android Project
        working-directory: delta/mobile
        run: npx expo prebuild --platform android --clean

      - name: Grant Execute Permission for Gradlew
        working-directory: delta/mobile/android
        run: chmod +x gradlew

      - name: Build Android Release APK
        working-directory: delta/mobile/android
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Locate and Collect APK
        run: |
          mkdir -p apk_output
          find delta/mobile/android/app/build/outputs/ -type f -name "*.apk" -exec cp -v {} apk_output/ \;
          ls -lh apk_output/

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || success()
        with:
          tag_name: mobile-v1.1.0-${{ github.run_number }}
          name: Delta Agent Mobile v1.1.0 Build #${{ github.run_number }}
          files: apk_output/*.apk
          draft: false
          prerelease: false

      - name: Rename & Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Delta-Agent-APK
          path: apk_output/*.apk
          if-no-files-found: error
          retention-days: 14
