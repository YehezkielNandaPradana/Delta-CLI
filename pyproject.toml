[build-system]

requires = ["setuptools>=64.0.0", "wheel"]

build-backend = "setuptools.build_meta"



[project]

name = "delta-security"

version = "1.0.0"

description = "Delta - AI-Powered Cyber Security Assessment CLI"

readme = "README.md"

requires-python = ">=3.11"

license = {text = "MIT"}

authors = [

    {name = "HackerAI", email = "dev@hackerai.co"},

]

keywords = ["security", "penetration-testing", "audit", "cli", "ai"]

classifiers = [

    "Development Status :: 5 - Production/Stable",

    "Environment :: Console",

    "Intended Audience :: Information Technology",

    "Intended Audience :: System Administrators",

    "License :: OSI Approved :: MIT License",

    "Natural Language :: English",

    "Operating System :: OS Independent",

    "Programming Language :: Python :: 3.11",

    "Programming Language :: Python :: 3.12",

    "Topic :: Security",

    "Topic :: System :: Networking",

]



[project.urls]

Homepage = "https://hackerai.co/delta"

Repository = "https://github.com/hackerai/delta"

Documentation = "https://docs.hackerai.co/delta"



[project.optional-dependencies]

rich = ["rich>=13.0.0"]

prompt = ["prompt-toolkit>=3.0.0"]

search = ["requests>=2.28.0", "beautifulsoup4>=4.11.0"]

ml = ["numpy>=1.24.0", "scikit-learn>=1.2.0"]

vtuber = ["pydantic>=2.0.0", "websockets>=11.0"]

test = ["pytest>=7.0.0", "pytest-asyncio>=0.20.0"]

all = ["delta-security[rich,prompt,search,ml,vtuber,test]"]



[project.scripts]

delta = "delta.main:main"

Delta = "delta.main:main"



[tool.setuptools.packages.find]

include = ["delta*"]